name: Package and release

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Package module
        shell: bash
        run: |
          set -euo pipefail
          for script in customize.sh action.sh boot-completed.sh scripts/*.sh; do
            sh -n "$script"
          done
          zip -r -9 "$RUNNER_TEMP/chore.zip" \
            module.prop customize.sh action.sh boot-completed.sh \
            scripts system META-INF README.md
          zip -T "$RUNNER_TEMP/chore.zip"

      - name: Update latest tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/latest-tag-response.txt"
          if gh api --include "repos/$GH_REPO/git/ref/tags/latest" > "$response"; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true
          elif grep -qE '^HTTP/[0-9.]+ 404([[:space:]]|$)' "$response"; then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref=refs/tags/latest -f sha="$GITHUB_SHA"
          else
            cat "$response" >&2
            exit 1
          fi

      - name: Publish latest release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest
          body: "Latest module package. Commit: ${{ github.sha }}"
          make_latest: 'true'
          files: ${{ runner.temp }}/chore.zip
          overwrite_files: true
          fail_on_unmatched_files: true
